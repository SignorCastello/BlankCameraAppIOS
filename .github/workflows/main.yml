name: Build Unsigned iOS App

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main # Trigger on pull requests to the main branch

jobs:
  build-ios:
    runs-on: macos-latest # Use macOS runner for iOS builds

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Xcode environment
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v2
        with:
          xcode-version: 14 # Adjust Xcode version as needed

      # Step 4: Build the app and generate an unsigned .ipa file
      - name: Build the app
        run: |
          xcodebuild \
            -workspace ShutdownApp.xcodeproj \
            -scheme ShutdownApp \              
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.5.7

      # Step 5: Export the unsigned .ipa file
      - name: Export the .ipa
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -exportPath ${{ github.workspace }}/build \
            -exportOptionsPlist ${{ github.workspace }}/ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Step 6: Upload the unsigned .ipa file as an artifact
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v3
        with:
          name: Unsigned-iOS-App
          path: build/*.ipa
