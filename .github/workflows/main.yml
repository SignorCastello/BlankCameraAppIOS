name: Build Unsigned iOS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Xcode version (using Xcode directly on macOS runner)
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_14.0.app # Replace with the Xcode version you need

      # Step 3: Clean old build artifacts
      - name: Clean build directory
        run: rm -rf build

      # Step 4: Build the app and generate an unsigned .ipa file
      - name: Build the app
        run: |
          xcodebuild \
            -project BlankCameraAppIOS/ShutdownApp.xcodeproj \ # Path to your .xcodeproj file
            -scheme ShutdownApp \                              # Scheme name
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.5.7

      # Step 5: Create ExportOptions.plist dynamically
      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ${{ github.workspace }}/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      # Step 6: Export the unsigned .ipa file
      - name: Export the .ipa
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ${{ github.workspace }}/build/App.xcarchive \
            -exportPath ${{ github.workspace }}/build \
            -exportOptionsPlist ${{ github.workspace }}/ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Step 7: Upload the unsigned .ipa file as an artifact
      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v3
        with:
          name: Unsigned-iOS-App
          path: build/*.ipa
