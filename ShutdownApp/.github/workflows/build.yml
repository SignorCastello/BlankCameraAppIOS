name: Build iOS App
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Xcode project
        run: |
          mkdir -p ShutdownApp.xcodeproj
          # Create a minimal project structure
          xcodebuild -create-xcodeproj -project ShutdownApp.xcodeproj
          
      - name: Build unsigned app
        run: |
          xcodebuild -scheme ShutdownApp \
                    -project ShutdownApp.xcodeproj \
                    -configuration Release \
                    -sdk iphoneos \
                    CODE_SIGN_IDENTITY="" \
                    CODE_SIGNING_REQUIRED=NO \
                    build
                    
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: build/Release-iphoneos/ShutdownApp.app